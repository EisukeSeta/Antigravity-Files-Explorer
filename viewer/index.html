<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity File Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0f14;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --folder-color: #fbbf24;
            --file-color: #60a5fa;
            --exe-color: #f87171;
            --img-color: #34d399;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #818cf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .path-indicator {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 12px;
            display: inline-block;
        }

        .controls {
            margin-top: 20px;
            display: none;
            /* S3静的ホスティングではサーバーサイドAPI不可のため非表示 */
        }

        .update-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
            filter: brightness(1.1);
        }

        .update-btn:active {
            transform: translateY(0);
        }

        .update-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading .spinner {
            display: block;
        }

        .explorer-tree {
            list-style: none;
            margin-top: 30px;
        }

        .tree-item {
            margin: 4px 0;
        }

        .tree-node {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            text-decoration: none;
            color: inherit;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .tree-node:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
            transform: translateX(5px);
        }

        .icon {
            margin-right: 12px;
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .folder-icon {
            color: var(--folder-color);
        }

        .file-icon {
            color: var(--file-color);
        }

        .exe-icon {
            color: var(--exe-color);
        }

        .img-icon {
            color: var(--img-color);
        }

        .name {
            flex: 1;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .indent {
            margin-left: 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            padding-left: 10px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .indent.collapsed {
            display: none;
        }

        .toggle-arrow {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            color: var(--text-secondary);
            font-size: 0.7rem;
        }

        .toggle-arrow.collapsed {
            transform: rotate(-90deg);
        }

        .folder-node {
            cursor: pointer;
        }

        .search-container {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
            pointer-events: none;
        }

        mark {
            background: rgba(79, 70, 229, 0.6);
            color: white;
            border-radius: 4px;
            padding: 0 2px;
        }

        /* Preview Modal */
        .preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .preview-overlay.active {
            display: flex;
            opacity: 1;
        }

        .preview-content {
            width: 90%;
            max-width: 1000px;
            max-height: 85vh;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
        }

        .preview-title {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .close-preview {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-preview:hover {
            color: var(--text-primary);
        }

        .preview-body {
            flex: 1;
            overflow-y: auto;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }

        .preview-body img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        .preview-body pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid var(--glass-border);
        }

        /* Markdown Styles */
        .markdown-content h1,
        .markdown-content h2 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.3em;
        }

        .markdown-content p {
            margin-bottom: 1em;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 1em;
        }

        .markdown-content code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Antigravity File Explorer</h1>
            <div class="path-indicator">c:\Win_tools\Antigravity</div>
            <div class="controls">
                <button id="updateBtn" class="update-btn">
                    <span class="spinner"></span>
                    <span class="btn-text">リストを更新</span>
                </button>
            </div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="ファイルを検索..." spellcheck="false">
            </div>
        </header>

        <div id="treeContainer">
            <!-- 階層構造がここに動的に生成されます -->
        </div>

        <footer>
            &copy; 2026 Antigravity System | Static Hosting Mode (S3)
        </footer>
    </div>

    <!-- Preview Modal -->
    <div id="previewOverlay" class="preview-overlay">
        <div class="preview-content">
            <div class="preview-header">
                <span id="previewTitle" class="preview-title">Filename</span>
                <button id="closePreview" class="close-preview">&times;</button>
            </div>
            <div id="previewBody" class="preview-body">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const treeContainer = document.getElementById('treeContainer');
        const updateBtn = document.getElementById('updateBtn');
        const searchInput = document.getElementById('searchInput');
        const previewOverlay = document.getElementById('previewOverlay');
        const previewBody = document.getElementById('previewBody');
        const previewTitle = document.getElementById('previewTitle');
        const closePreview = document.getElementById('closePreview');

        let allFileData = [];
        let searchQuery = '';

        function formatSize(bytes) {
            if (!bytes) return '';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return `${bytes.toFixed(1)} ${units[i]}`;
        }

        function getIcon(item) {
            if (item.isDir) return '📁';
            if (item.ext === '.exe') return '⚡';
            if (['.jpg', '.png', '.gif', '.webp'].includes(item.ext)) return '🖼️';
            if (['.md', '.txt', '.json'].includes(item.ext)) return '📄';
            return '📄';
        }

        function getIconClass(item) {
            if (item.isDir) return 'folder-icon';
            if (item.ext === '.exe') return 'exe-icon';
            if (['.jpg', '.png', '.gif', '.webp'].includes(item.ext)) return 'img-icon';
            return 'file-icon';
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function filterItems(items, query) {
            if (!query) return items;
            const lowerQuery = query.toLowerCase();

            return items.map(item => {
                const nameMatches = item.name.toLowerCase().includes(lowerQuery);
                let childrenMatches = [];

                if (item.isDir && item.children) {
                    childrenMatches = filterItems(item.children, query);
                }

                if (nameMatches || childrenMatches.length > 0) {
                    return { ...item, children: childrenMatches.length > 0 ? childrenMatches : (item.isDir ? [] : undefined) };
                }
                return null;
            }).filter(item => item !== null);
        }

        function createTreeElement(items, query = '') {
            const ul = document.createElement('ul');
            ul.className = 'explorer-tree';

            items.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'tree-item';

                const a = document.createElement('a');
                a.className = 'tree-node';
                if (item.isDir) a.classList.add('folder-node');
                a.href = item.isDir ? '#' : `/${item.path.replace(/\\/g, '/')}`;

                // トグル矢印の追加（フォルダのみ）
                if (item.isDir) {
                    const arrow = document.createElement('span');
                    arrow.className = 'toggle-arrow';
                    arrow.innerHTML = '▼';
                    a.appendChild(arrow);
                }

                // プレビュー対応ファイルの場合はイベントをハンドリング
                if (!item.isDir && canPreview(item)) {
                    a.onclick = (e) => {
                        e.preventDefault();
                        openPreview(item);
                    };
                }

                const icon = document.createElement('span');
                icon.className = `icon ${getIconClass(item)}`;
                icon.textContent = getIcon(item);

                const name = document.createElement('span');
                name.className = 'name';
                name.innerHTML = highlightText(item.name, query);

                const meta = document.createElement('span');
                meta.className = 'meta';
                meta.textContent = item.isDir ? 'Directory' : formatSize(item.size);

                a.appendChild(icon);
                a.appendChild(name);
                a.appendChild(meta);
                li.appendChild(a);

                if (item.isDir && item.children && item.children.length > 0) {
                    const indent = document.createElement('div');
                    indent.className = 'indent';
                    const childUl = createTreeElement(item.children, query);
                    indent.appendChild(childUl);
                    li.appendChild(indent);

                    // フォルダクリックでトグル
                    const arrow = a.querySelector('.toggle-arrow');
                    a.addEventListener('click', (e) => {
                        if (!item.isDir) return;
                        e.preventDefault();
                        indent.classList.toggle('collapsed');
                        if (arrow) arrow.classList.toggle('collapsed');
                    });
                }

                ul.appendChild(li);
            });

            return ul;
        }

        async function renderTree() {
            const filteredData = filterItems(allFileData, searchQuery);
            treeContainer.innerHTML = '';
            if (filteredData.length === 0 && searchQuery) {
                treeContainer.innerHTML = '<p style="text-align:center; color:var(--text-secondary); margin-top:40px;">一致するファイルが見つかりません。</p>';
            } else {
                treeContainer.appendChild(createTreeElement(filteredData, searchQuery));
            }
        }

        function canPreview(item) {
            const ext = item.ext;
            const name = item.name.toUpperCase();
            const imageExts = ['.jpg', '.png', '.gif', '.webp', '.svg'];
            const textExts = ['.txt', '.js', '.json', '.css', '.py', '.html', '.md', ''];

            // 既知の拡張子、または拡張子なしで特定のファイル名（LICENSE等）をチェック
            return imageExts.includes(ext) || textExts.includes(ext) || name === 'LICENSE' || name === 'NOTICE';
        }

        async function openPreview(item) {
            const path = `/${item.path.replace(/\\/g, '/')}`;
            previewTitle.textContent = item.name;
            previewBody.innerHTML = '<div style="text-align:center; padding: 40px;">読み込み中...</div>';
            previewOverlay.classList.add('active');

            const isImage = ['.jpg', '.png', '.gif', '.webp', '.svg'].includes(item.ext);

            if (isImage) {
                previewBody.innerHTML = `<img src="${path}" alt="${item.name}">`;
            } else {
                try {
                    const response = await fetch(path);
                    const text = await response.text();

                    if (item.ext === '.md') {
                        previewBody.innerHTML = `<div class="markdown-content">${marked.parse(text)}</div>`;
                    } else {
                        previewBody.innerHTML = `<pre><code>${escapeHtml(text)}</code></pre>`;
                    }
                } catch (err) {
                    previewBody.innerHTML = '<div style="color:red; text-align:center; padding: 40px;">ファイルの読み込みに失敗しました。</div>';
                }
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        closePreview.onclick = () => {
            previewOverlay.classList.remove('active');
        };

        previewOverlay.onclick = (e) => {
            if (e.target === previewOverlay) previewOverlay.classList.remove('active');
        };

        async function loadFileList() {
            try {
                const response = await fetch('file_data.json?t=' + Date.now());
                allFileData = await response.json();
                renderTree();
            } catch (err) {
                treeContainer.innerHTML = '<p style="color:red; text-align:center;">リストの読み込みに失敗しました。</p>';
            }
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderTree();
        });

        updateBtn.addEventListener('click', async () => {
            updateBtn.classList.add('loading');
            try {
                const res = await fetch('/api/update', { method: 'POST' });
                if (res.ok) {
                    await loadFileList();
                } else {
                    alert('更新に失敗しました。');
                }
            } catch (err) {
                alert('サーバーとの通信に失敗しました。');
            } finally {
                updateBtn.classList.remove('loading');
            }
        });

        // 初回読み込み
        loadFileList();
    </script>
</body>

</html>
