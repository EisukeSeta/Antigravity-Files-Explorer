<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity File Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0d11;
            --sidebar-bg: rgba(255, 255, 255, 0.03);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --folder-color: #fbbf24;
            --file-color: #60a5fa;
            --exe-color: #f87171;
            --img-color: #34d399;
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            background: linear-gradient(to right, #818cf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .project-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
        }

        .project-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
            border-left: 3px solid transparent;
            /* For nested hover */
        }

        .project-item-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .project-item-content span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-project,
        .refresh-project,
        .edit-project {
            opacity: 0;
            transition: opacity 0.2s;
            color: var(--text-secondary);
            padding: 4px;
            border-radius: 4px;
            margin-left: 4px;
        }

        .project-item:hover .delete-project,
        .project-item:hover .refresh-project,
        .project-item:hover .edit-project {
            opacity: 1;
        }

        .delete-project:hover {
            color: var(--exe-color);
            background: rgba(248, 113, 113, 0.1);
        }

        .refresh-project:hover {
            color: var(--img-color);
            background: rgba(52, 211, 153, 0.1);
        }

        .edit-project:hover {
            color: var(--accent-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .project-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .project-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--text-primary);
            border-left-color: var(--accent-color);
        }

        .project-item .icon {
            font-size: 1.2rem;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--glass-border);
        }

        .action-btn {
            width: 100%;
            background: var(--glass-bg);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .action-btn:hover {
            background: var(--accent-color);
            box-shadow: 0 4px 15px var(--accent-glow);
            border-color: transparent;
        }

        .action-btn.primary {
            background: var(--accent-color);
            border-color: transparent;
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 40px;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .project-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .path-indicator {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 10px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .controls {
            margin-top: 20px;
            display: none;
            /* S3静的ホスティングではサーバーサイドAPI不可のため非表示 */
        }

        .update-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
            filter: brightness(1.1);
        }

        .update-btn:active {
            transform: translateY(0);
        }

        .update-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading .spinner {
            display: block;
        }

        .explorer-tree {
            list-style: none;
            margin-top: 20px;
        }

        .tree-item {
            margin: 4px 0;
        }

        .tree-node {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            text-decoration: none;
            color: inherit;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .tree-node:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
        }

        .icon {
            margin-right: 12px;
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .folder-icon {
            color: var(--folder-color);
        }

        .file-icon {
            color: var(--file-color);
        }

        .exe-icon {
            color: var(--exe-color);
        }

        .img-icon {
            color: var(--img-color);
        }

        .name {
            flex: 1;
        }

        .meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .indent {
            margin-left: 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            padding-left: 10px;
            overflow: hidden;
        }

        .indent.collapsed {
            display: none;
        }

        .toggle-arrow {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            color: var(--text-secondary);
            font-size: 0.7rem;
        }

        .toggle-arrow.collapsed {
            transform: rotate(-90deg);
        }

        .folder-node {
            cursor: pointer;
        }

        .search-container {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
            pointer-events: none;
        }

        mark {
            background: rgba(99, 102, 241, 0.5);
            color: white;
            border-radius: 4px;
            padding: 0 2px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            width: 90%;
            max-width: 500px;
            background: #11141a;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        /* Preview Modal */
        .preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .preview-overlay.active {
            display: flex;
        }

        .preview-content {
            width: 90%;
            max-width: 1000px;
            max-height: 85vh;
            background: #11141a;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .preview-title {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .close-preview {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-preview:hover {
            color: var(--text-primary);
        }

        .preview-body {
            flex: 1;
            overflow-y: auto;
        }

        .preview-body img {
            max-width: 100%;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        .preview-body pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            border: 1px solid var(--glass-border);
        }

        /* Markdown Styles */
        .markdown-content h1,
        .markdown-content h2 {
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.3em;
        }

        .markdown-content p {
            margin-bottom: 1em;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 1em;
        }

        .markdown-content code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Projects</h2>
        </div>
        <div id="projectList" class="project-list">
            <!-- Projects will be injected here -->
        </div>
        <div class="sidebar-footer">
            <button id="addProjectBtn" class="action-btn primary">
                <span>+</span> Add Project
            </button>
            <button id="importBtn" class="action-btn">
                <span>📂</span> Import JSON
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div class="container">
            <header>
                <h1 id="currentProjectName">Antigravity Explorer</h1>
                <div class="project-info">
                    <div id="currentProjectPath" class="path-indicator">Project Root</div>
                </div>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="ファイルを検索..."
                        spellcheck="false">
                </div>
            </header>

            <div id="treeContainer">
                <!-- 階層構造がここに動的に生成されます -->
            </div>

            <footer>
                &copy; 2026 Antigravity System | Universal Project Manager
            </footer>
        </div>
    </main>

    <!-- Project Modal -->
    <div id="projectModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>New Project</h3>
            </div>
            <div class="form-group">
                <label>Project Name</label>
                <input type="text" id="projName" class="form-control" placeholder="e.g. My Awesome Project">
            </div>
            <div class="form-group">
                <label>JSON URL (file_data.json)</label>
                <input type="text" id="projUrl" class="form-control" placeholder="https://example.com/file_data.json">
            </div>
            <div class="form-group">
                <label>Base URI (for preview)</label>
                <input type="text" id="projBase" class="form-control" placeholder="https://example.com/files/">
            </div>
            <div class="modal-footer">
                <button id="cancelProj" class="action-btn">Cancel</button>
                <button id="saveProj" class="action-btn primary">Save Project</button>
            </div>
        </div>
    </div>

    <!-- Hidden Input for File Import -->
    <input type="file" id="fileInput" style="display: none;" accept=".json">

    <!-- Preview Modal -->
    <div id="previewOverlay" class="preview-overlay">
        <div class="preview-content">
            <div class="preview-header">
                <span id="previewTitle" class="preview-title">Filename</span>
                <button id="closePreview" class="close-preview">&times;</button>
            </div>
            <div id="previewBody" class="preview-body">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const treeContainer = document.getElementById('treeContainer');
        const searchInput = document.getElementById('searchInput');
        const previewOverlay = document.getElementById('previewOverlay');
        const previewBody = document.getElementById('previewBody');
        const previewTitle = document.getElementById('previewTitle');
        const closePreview = document.getElementById('closePreview');
        const projectList = document.getElementById('projectList');
        const addProjectBtn = document.getElementById('addProjectBtn');
        const importBtn = document.getElementById('importBtn');
        const fileInput = document.getElementById('fileInput');
        const projectModal = document.getElementById('projectModal');
        const currentProjectName = document.getElementById('currentProjectName');
        const currentProjectPath = document.getElementById('currentProjectPath');
        const saveProj = document.getElementById('saveProj');
        const cancelProj = document.getElementById('cancelProj');

        let projects = [];
        let activeProjectId = null;
        let allFileData = [];
        let searchQuery = '';

        // --- Persistence ---
        function saveToCache() {
            localStorage.setItem('antigravity_projects', JSON.stringify(projects));
            localStorage.setItem('antigravity_active_id', activeProjectId);
        }

        let editingProjectId = null;

        function loadFromCache() {
            const cachedProjects = localStorage.getItem('antigravity_projects');
            const cachedActiveId = localStorage.getItem('antigravity_active_id');
            const cacheVersion = localStorage.getItem('antigravity_cache_ver');
            const CURRENT_VER = '3';

            if (cachedProjects && cacheVersion === CURRENT_VER) {
                projects = JSON.parse(cachedProjects);
                activeProjectId = cachedActiveId;
            } else {
                // Initialize/Reset with default projects
                const defaultProjs = [
                    {
                        id: 'default',
                        name: 'Explorer Source',
                        url: 'file_data.json',
                        baseUri: 'https://www.seta.mydns.jp/Antigravity-Files-Explorer/',
                        data: []
                    },
                    {
                        id: 'repo-full',
                        name: 'Full Repository',
                        url: 'repo_data.json',
                        baseUri: 'https://www.seta.mydns.jp/Antigravity-Files-Explorer/',
                        data: []
                    }
                ];
                projects = defaultProjs;
                activeProjectId = 'default';
                localStorage.setItem('antigravity_cache_ver', CURRENT_VER);
                saveToCache();
            }
            renderProjectList();
            if (activeProjectId) {
                switchToProject(activeProjectId);
            }
        }

        // --- Project Management ---
        function renderProjectList() {
            projectList.innerHTML = '';
            projects.forEach(proj => {
                const item = document.createElement('div');
                item.className = `project-item ${proj.id === activeProjectId ? 'active' : ''}`;

                const content = document.createElement('div');
                content.className = 'project-item-content';
                content.innerHTML = `<span class="icon">📁</span><span>${proj.name}</span>`;
                content.onclick = () => switchToProject(proj.id);

                const actions = document.createElement('div');
                actions.style.display = 'flex';

                // Edit Button
                const editBtn = document.createElement('span');
                editBtn.className = 'edit-project';
                editBtn.innerHTML = '⚙️';
                editBtn.title = 'Edit Project';
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    openEditModal(proj);
                };
                actions.appendChild(editBtn);

                if (proj.url) {
                    const refreshBtn = document.createElement('span');
                    refreshBtn.className = 'refresh-project';
                    refreshBtn.innerHTML = '🔄';
                    refreshBtn.title = 'Refresh Data';
                    refreshBtn.onclick = (e) => {
                        e.stopPropagation();
                        fetchProjectData(proj);
                    };
                    actions.appendChild(refreshBtn);
                }

                if (proj.id !== 'default' && proj.id !== 'repo-full') {
                    const delBtn = document.createElement('span');
                    delBtn.className = 'delete-project';
                    delBtn.innerHTML = '&times;';
                    delBtn.title = 'Delete Project';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteProject(proj.id);
                    };
                    actions.appendChild(delBtn);
                }

                item.appendChild(content);
                item.appendChild(actions);
                projectList.appendChild(item);
            });
        }

        function openEditModal(proj) {
            editingProjectId = proj.id;
            document.getElementById('projName').value = proj.name;
            document.getElementById('projUrl').value = proj.url || '';
            document.getElementById('projBase').value = proj.baseUri || '';
            document.querySelector('.modal-header h3').textContent = 'プロジェクトの編集';
            projectModal.classList.add('active');
        }

        function deleteProject(id) {
            if (!confirm('このプロジェクトを削除しますか？')) return;
            projects = projects.filter(p => p.id !== id);
            if (activeProjectId === id) {
                activeProjectId = 'default';
            }
            switchToProject(activeProjectId);
        }

        async function switchToProject(id) {
            activeProjectId = id;
            const proj = projects.find(p => p.id === id);
            if (!proj) return;

            currentProjectName.textContent = proj.name;
            currentProjectPath.textContent = proj.baseUri || 'Root';

            renderProjectList();

            if (proj.data && proj.data.length > 0) {
                allFileData = proj.data;
                renderTree();
            } else if (proj.url) {
                await fetchProjectData(proj);
            }
            saveToCache();
        }

        async function fetchProjectData(proj) {
            treeContainer.innerHTML = '<div style="text-align:center; padding: 40px;">プロジェクトデータを読み込み中...</div>';
            try {
                const url = proj.url.includes('?') ? proj.url : `${proj.url}?t=${Date.now()}`;
                const response = await fetch(url);
                const data = await response.json();
                proj.data = data;
                if (proj.id === activeProjectId) {
                    allFileData = data;
                    renderTree();
                }
                saveToCache();
            } catch (err) {
                treeContainer.innerHTML = '<p style="color:red; text-align:center;">データの取得に失敗しました。URLを確認してください。</p>';
            }
        }

        // --- UI Events ---
        addProjectBtn.onclick = () => {
            editingProjectId = null;
            document.getElementById('projName').value = '';
            document.getElementById('projUrl').value = '';
            document.getElementById('projBase').value = '';
            document.querySelector('.modal-header h3').textContent = '新しいプロジェクト';
            projectModal.classList.add('active');
        };

        cancelProj.onclick = () => projectModal.classList.remove('active');

        saveProj.onclick = () => {
            const name = document.getElementById('projName').value;
            const url = document.getElementById('projUrl').value;
            const base = document.getElementById('projBase').value;

            if (!name) return;

            if (editingProjectId) {
                const proj = projects.find(p => p.id === editingProjectId);
                if (proj) {
                    proj.name = name;
                    proj.url = url === '(Imported File)' ? proj.url : url;
                    proj.baseUri = base;
                }
                editingProjectId = null;
            } else {
                const newProj = {
                    id: Date.now().toString(),
                    name: name,
                    url: url,
                    baseUri: base,
                    data: importingData || []
                };
                projects.push(newProj);
                activeProjectId = newProj.id;
            }

            importingData = null;
            projectModal.classList.remove('active');
            renderProjectList();
            switchToProject(activeProjectId);
        };

        let importingData = null;
        importBtn.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    importingData = JSON.parse(event.target.result);
                    document.getElementById('projName').value = file.name.replace('.json', '');
                    document.getElementById('projUrl').value = '(Imported File)';
                    projectModal.classList.add('active');
                } catch (err) {
                    alert('JSONの解析に失敗しました。');
                }
            };
            reader.readAsText(file);
        };

        // --- Tree Rendering ---
        function formatSize(bytes) {
            if (!bytes) return '';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return `${bytes.toFixed(1)} ${units[i]}`;
        }

        function getIcon(item) {
            if (item.isDir) return '📁';
            if (item.ext === '.exe') return '⚡';
            if (['.jpg', '.png', '.gif', '.webp', '.svg'].includes(item.ext)) return '🖼️';
            return '📄';
        }

        function getIconClass(item) {
            if (item.isDir) return 'folder-icon';
            if (item.ext === '.exe') return 'exe-icon';
            if (['.jpg', '.png', '.gif', '.webp', '.svg'].includes(item.ext)) return 'img-icon';
            return 'file-icon';
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function filterItems(items, query) {
            if (!query) return items;
            const lowerQuery = query.toLowerCase();
            return items.map(item => {
                const nameMatches = item.name.toLowerCase().includes(lowerQuery);
                let childrenMatches = [];
                if (item.isDir && item.children) {
                    childrenMatches = filterItems(item.children, query);
                }
                if (nameMatches || childrenMatches.length > 0) {
                    return { ...item, children: childrenMatches.length > 0 ? childrenMatches : (item.isDir ? [] : undefined) };
                }
                return null;
            }).filter(item => item !== null);
        }

        function createTreeElement(items, query = '') {
            const ul = document.createElement('ul');
            ul.className = 'explorer-tree';
            items.sort((a, b) => (b.isDir - a.isDir) || a.name.localeCompare(b.name));

            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'tree-item';

                const a = document.createElement('a');
                a.className = 'tree-node';
                a.href = '#';

                if (item.isDir) {
                    const arrow = document.createElement('span');
                    arrow.className = 'toggle-arrow';
                    arrow.innerHTML = '▼';
                    a.appendChild(arrow);
                }

                if (!item.isDir && canPreview(item)) {
                    a.onclick = (e) => { e.preventDefault(); openPreview(item); };
                }

                const icon = document.createElement('span');
                icon.className = `icon ${getIconClass(item)}`;
                icon.textContent = getIcon(item);

                const name = document.createElement('span');
                name.className = 'name';
                name.innerHTML = highlightText(item.name, query);

                const meta = document.createElement('span');
                meta.className = 'meta';
                meta.textContent = item.isDir ? 'Directory' : formatSize(item.size);

                a.appendChild(icon);
                a.appendChild(name);
                a.appendChild(meta);
                li.appendChild(a);

                if (item.isDir && item.children && item.children.length > 0) {
                    const indent = document.createElement('div');
                    indent.className = 'indent';
                    const childUl = createTreeElement(item.children, query);
                    indent.appendChild(childUl);
                    li.appendChild(indent);

                    const arrow = a.querySelector('.toggle-arrow');
                    a.onclick = (e) => {
                        e.preventDefault();
                        indent.classList.toggle('collapsed');
                        if (arrow) arrow.classList.toggle('collapsed');
                    };
                }

                ul.appendChild(li);
            });
            return ul;
        }

        function renderTree() {
            const filteredData = filterItems(allFileData, searchQuery);
            treeContainer.innerHTML = '';
            if (filteredData.length === 0 && searchQuery) {
                treeContainer.innerHTML = '<p style="text-align:center; color:var(--text-secondary); margin-top:40px;">一致するファイルが見つかりません。</p>';
            } else {
                treeContainer.appendChild(createTreeElement(filteredData, searchQuery));
            }
        }

        // --- Preview Logic ---
        function canPreview(item) {
            const ext = item.ext;
            const name = item.name.toUpperCase();
            return ['.jpg', '.png', '.gif', '.webp', '.svg', '.txt', '.js', '.json', '.css', '.py', '.html', '.md'].includes(ext) || name === 'LICENSE';
        }

        async function openPreview(item) {
            const proj = projects.find(p => p.id === activeProjectId);
            const base = proj.baseUri || '';
            const cleanPath = item.path.replace(/\\/g, '/');
            const path = base ? (base.endsWith('/') ? base : base + '/') + (cleanPath.startsWith('/') ? cleanPath.substring(1) : cleanPath) : cleanPath;

            previewTitle.textContent = item.name;
            previewBody.innerHTML = '<div style="text-align:center; padding: 40px;">読み込み中...</div>';
            previewOverlay.classList.add('active');

            const isImage = ['.jpg', '.png', '.gif', '.webp', '.svg'].includes(item.ext);
            if (isImage) {
                previewBody.innerHTML = `<img src="${path}" alt="${item.name}">`;
            } else {
                try {
                    const response = await fetch(path);
                    const text = await response.text();
                    if (item.ext === '.md') {
                        previewBody.innerHTML = `<div class="markdown-content">${marked.parse(text)}</div>`;
                    } else {
                        previewBody.innerHTML = `<pre><code>${escapeHtml(text)}</code></pre>`;
                    }
                } catch (err) {
                    previewBody.innerHTML = '<div style="color:red; text-align:center; padding: 40px;">ファイルの読み込みに失敗しました。パスを確認してください。</div>';
                }
            }
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        closePreview.onclick = () => previewOverlay.classList.remove('active');
        previewOverlay.onclick = (e) => { if (e.target === previewOverlay) previewOverlay.classList.remove('active'); };

        searchInput.oninput = (e) => {
            searchQuery = e.target.value;
            renderTree();
        };

        // Initialize
        loadFromCache();
    </script>
</body>

</html>
