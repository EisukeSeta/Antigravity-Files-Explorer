name: Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      
      - name: Deploy to S3
        working-directory: viewer
        run: |
          aws s3 cp index.html s3://www.seta.mydns.jp/Antigravity-Files-Explorer/index.html
          aws s3 cp file_data.json s3://www.seta.mydns.jp/Antigravity-Files-Explorer/file_data.json
          aws s3 cp config.json s3://www.seta.mydns.jp/Antigravity-Files-Explorer/config.json
      
      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🌐 Live URL: https://www.seta.mydns.jp/Antigravity-Files-Explorer/"
